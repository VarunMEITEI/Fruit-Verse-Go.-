
name: Build Fruit Verse Go APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VarunFruit.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Extract game ZIP
        run: |
          mkdir -p extracted-project
          unzip -oq VarunFruit.zip -d extracted-project
          PUBSPEC="$(find extracted-project -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "Could not find Flutter project."
            exit 1
          fi
          PROJECT_DIR="${PUBSPEC%/pubspec.yaml}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Verse-Go-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
